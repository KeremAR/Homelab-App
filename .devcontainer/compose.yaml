services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    init: true
    environment:
      UV_CACHE_DIR: /home/vscode/.cache/uv
      UV_LINK_MODE: copy
      UV_PYTHON_DOWNLOADS: "0"
      NPM_CONFIG_CACHE: /home/vscode/.npm
      SECRET_KEY: dev-secret-key-change-before-production
      OTEL_SDK_DISABLED: "false"
      OTEL_TRACES_EXPORTER: "none"
    volumes:
      - ..:/workspace:cached
      - user-service-venv:/workspace/user-service/.venv
      - todo-service-venv:/workspace/todo-service/.venv
      - frontend-node-modules:/workspace/frontend/node_modules
      - uv-cache:/home/vscode/.cache/uv
      - npm-cache:/home/vscode/.npm
    depends_on:
      user-db:
        condition: service_healthy
      todo-db:
        condition: service_healthy

  user-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: userservice
      POSTGRES_PASSWORD: userpass
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - user-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U userservice -d userdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  todo-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tododb
      POSTGRES_USER: todoservice
      POSTGRES_PASSWORD: todopass
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - todo-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todoservice -d tododb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  user-service-venv:
  todo-service-venv:
  frontend-node-modules:
  uv-cache:
  npm-cache:
  user-db-data:
  todo-db-data:

networks:
  default:
    name: homelab-app-dev
